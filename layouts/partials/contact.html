{{- $email := .Site.Params.contact.email | default "ciao@frizzande.io" -}}
{{- $endpoint := .Site.Params.contact.endpoint -}}

<section class="contact mt-12 p-6 bg-gray-50 dark:bg-slate-800 max-w-xl mx-auto rounded-lg">

  <h2 class="text-xl font-semibold mb-4">reach out</h2>

  {{- if $endpoint }}
  <form id="contact-form" action="{{ $endpoint }}" method="POST" class="space-y-4">

    <!-- spam trap -->
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">

    <!-- Name -->
    <label class="block">
      <span class="text-sm font-medium text-gray-700 dark:text-slate-50">name</span>
      <input type="text" name="name" required autocomplete="name"
        class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-50 rounded shadow-sm focus:outline-none focus:ring-1 focus:ring-purple-400">
    </label>

    <!-- Email -->
    <label class="block">
      <span class="text-sm font-medium text-gray-700 dark:text-slate-50">email</span>
      <input type="email" name="email" required autocomplete="email"
        class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-50 rounded shadow-sm focus:outline-none focus:ring-1 focus:ring-purple-400">
    </label>

    <!-- Message -->
    <label class="block">
      <span class="text-sm font-medium text-gray-700 dark:text-slate-50">message</span>
      <textarea name="message" rows="5" required
        class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-50 rounded shadow-sm focus:outline-none focus:ring-1 focus:ring-purple-400 resize-y"></textarea>
    </label>

    <!-- Subscribe checkbox -->
    <label class="flex items-center gap-2 text-gray-700 dark:text-slate-50">
      <input type="checkbox" name="subscribe" value="yes" class="h-4 w-4 accent-purple-500">
      mailing list invitation
    </label>

    <!-- Submit button -->
    <button type="submit"
      class="mt-2 px-4 py-2 bg-white dark:bg-slate-50 dark:text-slate-800 border border-gray-800 dark:border-slate-600 rounded hover:bg-gray-100 focus:outline-none focus:ring-1 focus:ring-purple-400 disabled:opacity-50 disabled:cursor-not-allowed">
      send
    </button>

    <p id="contact-status" role="status" aria-live="polite" class="text-sm text-gray-700 dark:text-slate-50 empty:hidden"></p>

  </form>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      if (!form) return;
      var status = document.getElementById('contact-status');
      var button = form.querySelector('button[type="submit"]');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'sending…';

        var payload = Object.fromEntries(new FormData(form).entries());

        fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function (response) {
          if (!response.ok) throw new Error('status ' + response.status);
          form.reset();
          status.textContent = 'thanks — message sent :)';
        }).catch(function () {
          status.innerHTML = 'something broke. email me directly at <a class="underline" href="mailto:{{ $email }}">{{ $email }}</a>';
        }).finally(function () {
          button.disabled = false;
        });
      });
    })();
  </script>
  {{- else }}
  <p class="text-gray-700 dark:text-slate-50">
    email me at
    <a class="underline hover:text-purple-500" href="mailto:{{ $email }}">{{ $email }}</a>
  </p>
  {{- end }}

</section>
